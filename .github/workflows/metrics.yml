name: Metrics
on:
  # Berjalan otomatis setiap 12 jam
  schedule: [{cron: "0 */12 * * *"}]
  # Jalankan manual kapan saja via tab Actions
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: General Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NibroosAbrar
          template: classic
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_ignored: jupyter notebook, html, css  # Sembunyikan Jupyter otomatis
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
