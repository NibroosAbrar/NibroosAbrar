name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Slim Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NibroosAbrar
          filename: github-metrics.svg
          template: classic
          
          # Matikan semua info teks bawaan yang bikin penuh
          base: "" 
          
          # Aktifkan plugin bahasa dengan tampilan compact
          plugin_languages: yes
          plugin_languages_ignored: jupyter notebook, html, css
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_kind: languages
          plugin_languages_limit: 6
          
          # Pengaturan visual biar clean
          config_colors: "modern"
          config_padding: 0%
